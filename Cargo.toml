[package]
name = "api-checkin-helper"
version = "1.0.0"
edition = "2021"
description = "API 签到助手"
license = "MIT"

[lib]
name = "api_checkin_helper"
path = "src/lib.rs"

[[bin]]
name = "ApiCheckinHelper"
path = "src/main.rs"

[[bin]]
name = "uninstall"
path = "src/uninstall_main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["native-certs"] }
url = "2"
idna = "1"
regex = "1"
encoding_rs = "0.8"
tao = "0.30"
wry = "0.47"
ico = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Time",
    "Win32_System_Registry",
] }
